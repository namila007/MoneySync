name: money_sync
description: "Local-first SMS transaction review and Wallet synchronization."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  sqlite3: ^3.3.4

dev_dependencies:
  build_runner: ^2.15.0
  # Flutter 3.44 pins test_api; 2.34.0 is the newest Drift generator whose
  # analyzer range remains compatible with that SDK's test toolchain.
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
