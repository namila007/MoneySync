name: Verify Money Sync

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  NDK_VERSION: 30.0.15729638

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Accept Android SDK licenses and install NDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="${android_sdk_root}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${sdkmanager_path}" ]]; then
            echo "::error::sdkmanager was not found at ${sdkmanager_path}"
            exit 1
          fi

          "${sdkmanager_path}" --version
          set +o pipefail
          yes | "${sdkmanager_path}" --licenses > /dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "ndk;${NDK_VERSION}"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated code
        run: |
          dart run build_runner build
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage --branch-coverage

      - name: Verify source hygiene
        run: bash tool/verify_source_hygiene.sh

      - name: Build Play flavor
        run: flutter build apk --debug --flavor playManual -t lib/main_play_manual.dart

      - name: Build private flavor
        run: flutter build apk --debug --flavor privateFull -t lib/main_private_full.dart

      - name: Audit merged APK permissions
        run: |
          bash tool/verify_android_permissions.sh \
            build/app/outputs/flutter-apk/app-playmanual-debug.apk \
            build/app/outputs/flutter-apk/app-privatefull-debug.apk
