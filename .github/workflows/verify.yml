name: Verify Money Sync

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test and record informational M0 coverage
        run: flutter test --coverage --branch-coverage

      - name: Verify source hygiene
        run: bash tool/verify_source_hygiene.sh

      - name: Build permission-free Play flavor
        run: flutter build apk --debug --flavor playManual -t lib/main_play_manual.dart

      - name: Build private flavor with M0 capabilities disabled
        run: flutter build apk --debug --flavor privateFull -t lib/main_private_full.dart

      - name: Audit merged APK permissions
        run: |
          bash tool/verify_android_permissions.sh \
            build/app/outputs/flutter-apk/app-playmanual-debug.apk \
            build/app/outputs/flutter-apk/app-privatefull-debug.apk

      - name: Record generated-code gate
        run: |
          if rg --quiet '^[[:space:]]*(build_runner|freezed|drift_dev|riverpod_generator|pigeon):' pubspec.yaml; then
            echo "Generated-code inputs exist; add their pinned generation command before merging."
            exit 1
          fi
          echo "M0 has no generated-code inputs; generation check is not applicable."
