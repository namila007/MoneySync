<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync E2E · Full Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Full E2E</p>
    <h1>End-to-end test execution</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
      <title id="seq-title">Full E2E Sequence</title>
      <desc id="seq-desc">Sequence diagram showing the complete E2E test flow from agent through ADB to app and BudgetBakers API, covering onboarding, wallet setup, SMS import, create now, and save for later phases.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="120" y1="60" x2="120" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="320" y1="60" x2="320" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="520" y1="60" x2="520" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="720" y1="60" x2="720" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="900" y1="60" x2="900" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Participants -->
      <rect x="60" y="40" width="120" height="32" rx="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
      <text x="120" y="60" fill="#ffffff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>

      <rect x="260" y="40" width="120" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Step Script</text>

      <rect x="460" y="40" width="120" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ADB</text>

      <rect x="660" y="40" width="120" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App</text>

      <rect x="840" y="40" width="120" height="32" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="900" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API</text>

      <!-- Phase 1: Onboarding -->
      <rect x="40" y="90" width="920" height="80" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="94" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="103" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ONBOARDING</text>

      <line x1="120" y1="120" x2="316" y2="120" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="324" y1="120" x2="516" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="524" y1="120" x2="716" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="140" y="108" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="117" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAUNCH + TAP NEXT ×6</text>

      <rect x="350" y="108" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="117" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTE TAP</text>

      <rect x="560" y="108" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="117" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI UPDATE</text>

      <line x1="724" y1="130" x2="324" y2="130" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="480" y="118" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="127" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">XML STATE</text>

      <line x1="324" y1="140" x2="124" y2="140" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="180" y="128" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">screen=home</text>

      <!-- Phase 2: Wallet -->
      <rect x="40" y="190" width="920" height="60" rx="8" fill="rgba(255,193,7,0.04)" stroke="rgba(255,193,7,0.20)" stroke-width="0.8"/>
      <rect x="420" y="194" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="203" fill="rgba(200,150,0,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WALLET SETUP</text>

      <line x1="120" y1="220" x2="316" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="324" y1="220" x2="716" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="724" y1="230" x2="896" y2="230" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <rect x="140" y="208" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTER TOKEN + CONNECT</text>

      <rect x="380" y="208" width="260" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TYPE TOKEN + TAP SAVE + CONNECT</text>

      <rect x="760" y="218" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="810" y="227" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /auth</text>

      <!-- Phase 3: Import -->
      <rect x="40" y="270" width="920" height="60" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="274" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="283" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SMS IMPORT</text>

      <line x1="120" y1="300" x2="316" y2="300" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="324" y1="300" x2="516" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="524" y1="300" x2="716" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="140" y="288" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="297" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEED SMS + RUN SCAN</text>

      <rect x="360" y="288" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="430" y="297" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMU SMS SEND</text>

      <rect x="560" y="288" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="297" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HISTORY SCAN</text>

      <!-- Phase 4: Create Now -->
      <rect x="40" y="350" width="440" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="160" y="354" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="363" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CREATE NOW</text>

      <line x1="120" y1="390" x2="316" y2="390" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="324" y1="390" x2="716" y2="390" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="724" y1="400" x2="896" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <rect x="140" y="378" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="387" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW + CREATE</text>

      <rect x="380" y="378" width="260" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="387" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILL FIELDS + TAP CREATE</text>

      <rect x="760" y="388" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="810" y="397" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /records</text>

      <rect x="140" y="420" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="190" y="429" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>

      <line x1="120" y1="440" x2="316" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="428" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="437" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK COUNTS + LOGS</text>

      <!-- Phase 5: Save for Later -->
      <rect x="520" y="350" width="440" height="120" rx="8" fill="rgba(255,193,7,0.04)" stroke="rgba(255,193,7,0.20)" stroke-width="0.8"/>
      <rect x="640" y="354" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="363" fill="rgba(200,150,0,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SAVE FOR LATER</text>

      <line x1="560" y1="390" x2="716" y2="390" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="724" y1="390" x2="896" y2="390" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="560" y="378" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="387" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW + SAVE</text>

      <rect x="760" y="378" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="810" y="387" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUED</text>

      <rect x="560" y="420" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="429" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE + VERIFY</text>

      <line x1="560" y1="440" x2="716" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="724" y1="450" x2="896" y2="450" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <rect x="760" y="438" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="810" y="447" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /records</text>

      <!-- Result -->
      <rect x="60" y="490" width="120" height="32" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="510" fill="#ffffff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMPLETE</text>

      <line x1="324" y1="480" x2="124" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="180" y="478" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="487" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALL PHASES OK</text>

      <!-- Legend -->
      <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="552" x2="180" y2="552" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="190" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Agent command</text>
      <line x1="340" y1="552" x2="380" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="390" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Internal flow</text>
      <line x1="540" y1="552" x2="580" y2="552" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="590" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">External API</text>
      <line x1="740" y1="552" x2="780" y2="552" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="790" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Return / async</text>
    </svg>
  </div>
</body>
</html>
