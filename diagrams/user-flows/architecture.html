<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync E2E · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · MoneySync E2E</p>
    <h1>End-to-end testing architecture</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">MoneySync E2E Architecture</title>
      <desc id="arch-desc">Architecture diagram showing AI agent driving step scripts via ADB to test MoneySync app on Android emulator, with BudgetBakers Wallet API as external service.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: Agent Layer -->
      <rect x="40" y="80" width="280" height="200" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="120" y="84" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="180" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">AGENT LAYER</text>

      <!-- Zone: Step Scripts -->
      <rect x="380" y="80" width="240" height="200" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="440" y="84" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">STEP SCRIPTS</text>

      <!-- Zone: Device Layer -->
      <rect x="680" y="80" width="280" height="200" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="760" y="84" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">DEVICE LAYER</text>

      <!-- Arrows (drawn first) -->
      <line x1="260" y1="180" x2="380" y2="180" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="540" y1="180" x2="680" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="820" y1="240" x2="820" y2="340" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="300" y="162" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="172" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRIVES</text>

      <rect x="590" y="162" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="626" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTES</text>

      <rect x="830" y="280" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="854" y="290" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>

      <!-- Nodes: Agent Layer -->
      <rect x="80" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="88" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="102" y="157" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
      <text x="160" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Agent</text>
      <text x="160" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Reads output, decides</text>

      <!-- Nodes: Step Scripts -->
      <rect x="420" y="120" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="428" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="454" y="137" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
      <text x="500" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">step_*.sh</text>
      <text x="500" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">27 atomic scripts</text>

      <rect x="420" y="200" width="160" height="60" rx="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="208" width="52" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.60)" stroke-width="0.8"/>
      <text x="454" y="217" fill="rgba(255,255,255,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIBRARY</text>
      <text x="500" y="228" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">helpers.sh</text>
      <text x="500" y="248" fill="rgba(255,255,255,0.8)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">All UI logic lives here</text>

      <!-- Nodes: Device Layer -->
      <rect x="720" y="120" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="728" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="742" y="137" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADB</text>
      <text x="800" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Android Debug Bridge</text>
      <text x="800" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UI interaction + SMS</text>

      <rect x="720" y="200" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="728" y="208" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="754" y="217" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="800" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MoneySync App</text>
      <text x="800" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">privateFull flavor</text>

      <!-- External: BudgetBakers API -->
      <rect x="720" y="360" width="240" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="728" y="368" width="68" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="762" y="377" fill="rgba(45,49,66,0.5)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="840" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BudgetBakers Wallet API</text>
      <text x="840" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /v1/api/records</text>

      <!-- Orchestrators -->
      <rect x="40" y="340" width="580" height="120" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="260" y="344" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="353" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">ORCHESTRATORS</text>

      <rect x="60" y="370" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="394" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flow_onboarding</text>

      <rect x="200" y="370" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="394" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flow_wallet</text>

      <rect x="340" y="370" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="394" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flow_create_now</text>

      <rect x="480" y="370" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="394" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flow_save_later</text>

      <rect x="60" y="420" width="260" height="24" rx="4" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="190" y="436" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">flow_full_e2e → chains all phases</text>

      <!-- Legend -->
      <line x1="40" y1="490" x2="960" y2="490" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="498" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Component</text>
      <rect x="240" y="498" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
      <text x="260" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Focal (1-2 max)</text>
      <rect x="400" y="498" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="420" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">External</text>
      <line x1="540" y1="504" x2="570" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="580" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Internal flow</text>
      <line x1="700" y1="504" x2="730" y2="504" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="740" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">External API</text>
    </svg>
  </div>
</body>
</html>
