<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync E2E · Onboarding Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Onboarding</p>
    <h1>First-launch setup sequence</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="onb-title onb-desc">
      <title id="onb-title">Onboarding Flow</title>
      <desc id="onb-desc">Flowchart showing the 8-step onboarding sequence from welcome screen through SMS permission grant to home screen.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Start -->
      <circle cx="80" cy="200" r="24" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="204" fill="#ffffff" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GO</text>

      <!-- Steps -->
      <rect x="140" y="176" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="190" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Welcome</text>

      <rect x="280" y="176" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="330" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Privacy</text>

      <rect x="420" y="176" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="470" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source SMS</text>

      <rect x="560" y="176" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="610" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Device</text>

      <rect x="700" y="176" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="750" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Permissions</text>

      <rect x="840" y="176" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="890" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Disclosure</text>

      <!-- SMS Decision -->
      <rect x="420" y="280" width="160" height="48" rx="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="308" fill="#ffffff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SMS Permission</text>

      <!-- Home -->
      <circle cx="500" cy="380" r="24" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="384" fill="#ffffff" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">END</text>

      <!-- Arrows -->
      <line x1="104" y1="200" x2="136" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="244" y1="200" x2="276" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="384" y1="200" x2="416" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="524" y1="200" x2="556" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="664" y1="200" x2="696" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="804" y1="200" x2="836" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Disclosure → SMS -->
      <path d="M 890,224 V 304 H 584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- SMS → Home -->
      <line x1="500" y1="328" x2="500" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Step labels -->
      <rect x="164" y="156" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="190" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAP NEXT</text>

      <rect x="304" y="156" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAP NEXT</text>

      <rect x="444" y="156" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAP NEXT</text>

      <rect x="584" y="156" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="610" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAP NEXT</text>

      <rect x="724" y="156" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="750" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAP NEXT</text>

      <rect x="864" y="156" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="890" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAP NEXT</text>

      <!-- SMS labels -->
      <rect x="640" y="252" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="261" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRANT</text>

      <rect x="510" y="336" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="534" y="345" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINISH</text>

      <!-- Legend -->
      <line x1="40" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="140" cy="432" r="8" fill="#eb6c36"/>
      <text x="156" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Start / Key decision</text>
      <rect x="320" y="424" width="16" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Step</text>
      <circle cx="460" cy="432" r="8" fill="#2d3142"/>
      <text x="476" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">End state</text>
    </svg>
  </div>
</body>
</html>
