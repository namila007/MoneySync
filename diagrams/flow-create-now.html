<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync E2E · Create Now Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Create Now</p>
    <h1>Immediate wallet record creation</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cr-title cr-desc">
      <title id="cr-title">Create Now Flow</title>
      <desc id="cr-desc">Flowchart showing the Create Now flow from SMS seed through review panel to wallet record creation and verification.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Phase 1: Seed & Import -->
      <rect x="40" y="40" width="920" height="80" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="44" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 1: SEED &amp; IMPORT</text>

      <rect x="60" y="64" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seed SMS</text>

      <rect x="200" y="64" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Scan</text>

      <rect x="340" y="64" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="390" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open Inbox</text>

      <rect x="480" y="64" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tap Message</text>

      <line x1="164" y1="84" x2="196" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="304" y1="84" x2="336" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="444" y1="84" x2="476" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Phase 2: Review Panel -->
      <rect x="40" y="160" width="920" height="200" rx="8" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <rect x="400" y="164" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="173" fill="rgba(235,108,54,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 2: REVIEW PANEL</text>

      <!-- Review fields -->
      <rect x="60" y="200" width="100" height="48" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="110" y="220" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Set Kind</text>
      <text x="110" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">income/expense</text>

      <rect x="200" y="200" width="100" height="48" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="250" y="220" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Set Direction</text>
      <text x="250" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">credit/debit</text>

      <rect x="340" y="200" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="220" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Select Account</text>
      <text x="400" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TEST_ACCOUNT</text>

      <rect x="500" y="200" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="550" y="220" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Amount</text>
      <text x="550" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">non-zero</text>

      <rect x="640" y="200" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="690" y="220" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Category</text>
      <text x="690" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">required</text>

      <rect x="780" y="200" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="830" y="220" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Date</text>
      <text x="830" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pick date</text>

      <rect x="60" y="280" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="304" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add Note</text>

      <!-- Arrows in review -->
      <line x1="164" y1="224" x2="196" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="304" y1="224" x2="336" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="464" y1="224" x2="496" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="604" y1="224" x2="636" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="744" y1="224" x2="776" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Phase 3: Submit -->
      <rect x="40" y="400" width="920" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="404" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="413" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 3: SUBMIT &amp; VERIFY</text>

      <rect x="60" y="430" width="140" height="56" rx="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
      <text x="130" y="454" fill="#ffffff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create Record</text>
      <text x="130" y="472" fill="rgba(255,255,255,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /records</text>

      <rect x="260" y="430" width="140" height="56" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="330" y="454" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP 200 OK</text>
      <text x="330" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">record created</text>

      <rect x="460" y="430" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="530" y="454" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify Logs</text>
      <text x="530" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Created record</text>

      <rect x="660" y="430" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="730" y="454" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify Counts</text>
      <text x="730" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Success += 1</text>

      <rect x="860" y="430" width="80" height="56" rx="28" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="462" fill="#ffffff" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DONE</text>

      <!-- Arrows in submit -->
      <line x1="204" y1="458" x2="256" y2="458" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="404" y1="458" x2="456" y2="458" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="604" y1="458" x2="656" y2="458" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="804" y1="458" x2="856" y2="458" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connect phases -->
      <path d="M 540,104 V 132 Q 540,140 540,140 H 500 Q 500,160 500,160 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 120,304 V 372 Q 120,380 120,380 H 130 Q 130,400 130,400 V 426" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- SMS mapping note -->
      <rect x="60" y="540" width="400" height="40" rx="6" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <text x="80" y="558" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SMS MAPPING:</text>
      <text x="80" y="574" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">credited → income/credit | debited → expense/debit</text>

      <!-- Legend -->
      <line x1="40" y1="600" x2="960" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    </svg>
  </div>
</body>
</html>
