<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync E2E · Save for Later Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Save for Later</p>
    <h1>Deferred wallet record creation</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sfl-title sfl-desc">
      <title id="sfl-title">Save for Later Flow</title>
      <desc id="sfl-desc">Flowchart showing the Save for Later flow from SMS seed through review panel to waiting queue approval and verification.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Phase 1: Seed & Import (same as Create Now) -->
      <rect x="40" y="40" width="920" height="80" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="44" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 1: SEED &amp; IMPORT</text>

      <rect x="60" y="64" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seed SMS</text>

      <rect x="200" y="64" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Scan</text>

      <rect x="340" y="64" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="390" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open Inbox</text>

      <rect x="480" y="64" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tap Message</text>

      <line x1="164" y1="84" x2="196" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="304" y1="84" x2="336" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="444" y1="84" x2="476" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Phase 2: Review Panel -->
      <rect x="40" y="160" width="920" height="160" rx="8" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <rect x="400" y="164" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="173" fill="rgba(235,108,54,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 2: REVIEW PANEL</text>

      <rect x="60" y="200" width="80" height="40" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="100" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kind</text>

      <rect x="160" y="200" width="80" height="40" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="200" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Direction</text>

      <rect x="260" y="200" width="100" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Account</text>

      <rect x="380" y="200" width="80" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Amount</text>

      <rect x="480" y="200" width="80" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Category</text>

      <rect x="580" y="200" width="80" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Date</text>

      <rect x="60" y="260" width="100" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="280" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add Note</text>

      <line x1="144" y1="220" x2="156" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="244" y1="220" x2="256" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="364" y1="220" x2="376" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="464" y1="220" x2="476" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="564" y1="220" x2="576" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Phase 3: Save for Later -->
      <rect x="40" y="360" width="440" height="120" rx="8" fill="rgba(255,193,7,0.06)" stroke="rgba(255,193,7,0.30)" stroke-width="0.8"/>
      <rect x="160" y="364" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="373" fill="rgba(200,150,0,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 3: SAVE FOR LATER</text>

      <rect x="60" y="400" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="130" y="420" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tap Save for Later</text>
      <text x="130" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mutation queued</text>

      <rect x="240" y="400" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="420" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify Waiting=1</text>
      <text x="300" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">home counts</text>

      <line x1="204" y1="424" x2="236" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Phase 4: Waiting Queue -->
      <rect x="520" y="360" width="440" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="640" y="364" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="373" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 4: WAITING QUEUE</text>

      <rect x="540" y="400" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="420" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open Waiting</text>
      <text x="600" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tap tile</text>

      <rect x="690" y="400" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="420" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tap Approve</text>
      <text x="740" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">confirm</text>

      <rect x="820" y="400" width="120" height="48" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="880" y="420" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP 200 OK</text>
      <text x="880" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">record created</text>

      <line x1="664" y1="424" x2="686" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="794" y1="424" x2="816" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Connect phases -->
      <path d="M 480,424 H 516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 540,104 V 132 Q 540,140 540,140 H 500 Q 500,160 500,160 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 110,292 V 332 Q 110,340 110,340 H 130 Q 130,360 130,360 V 396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Phase 5: Verify -->
      <rect x="40" y="520" width="920" height="100" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="524" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="533" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 5: VERIFY</text>

      <rect x="60" y="550" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="130" y="570" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify Counts</text>
      <text x="130" y="586" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Success += 1</text>

      <rect x="240" y="550" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="570" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify Logs</text>
      <text x="310" y="586" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Created record</text>

      <rect x="420" y="550" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="570" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Activity Log</text>
      <text x="490" y="586" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">wallet created</text>

      <rect x="600" y="550" width="80" height="48" rx="28" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="578" fill="#ffffff" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DONE</text>

      <line x1="204" y1="574" x2="236" y2="574" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="384" y1="574" x2="416" y2="574" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="564" y1="574" x2="596" y2="574" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connect verify to phases -->
      <path d="M 880,448 V 492 Q 880,500 880,500 H 490 Q 490,520 490,520 V 546" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Waiting queue state -->
      <rect x="60" y="640" width="300" height="40" rx="6" fill="rgba(255,193,7,0.06)" stroke="rgba(255,193,7,0.20)" stroke-width="0.8"/>
      <text x="80" y="664" fill="#c89600" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">WAITING QUEUE:</text>
      <text x="200" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">queued → syncing → succeeded</text>

      <!-- Legend -->
      <line x1="40" y1="690" x2="960" y2="690" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    </svg>
  </div>
</body>
</html>
