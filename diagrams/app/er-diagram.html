<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync — Database ER Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--link:#2e5aa8;
      --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}
    .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
    svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER Diagram · Database Schema v15</p>
    <h1>MoneySync Data Model</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">MoneySync ER Diagram</title>
      <desc id="er-desc">Entity-relationship diagram showing the core database tables and their cardinality relationships.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="20" y="20" width="280" height="180" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="160" y="38" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" text-anchor="middle" letter-spacing=".14em">SMS &amp; INGESTION</text>

      <rect x="320" y="20" width="360" height="180" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="500" y="38" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" text-anchor="middle" letter-spacing=".14em">OUTBOX &amp; MUTATIONS</text>

      <rect x="700" y="20" width="280" height="180" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="840" y="38" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" text-anchor="middle" letter-spacing=".14em">WALLET CACHES</text>

      <!-- sms_events -->
      <rect x="32" y="52" width="120" height="48" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="92" y="80" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">sms_events</text>

      <!-- transaction_candidates -->
      <rect x="172" y="52" width="120" height="48" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="232" y="80" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">candidates</text>

      <!-- tracked_senders -->
      <rect x="32" y="132" width="108" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="86" y="156" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">tracked_senders</text>

      <!-- rule_packs -->
      <rect x="152" y="132" width="88" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="196" y="156" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">rule_packs</text>

      <!-- ingestion_checkpoint -->
      <rect x="252" y="132" width="40" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="272" y="156" fill="var(--muted)" font-size="8" font-weight="600" font-family="var(--sans)" text-anchor="middle">ckpt</text>

      <!-- mapping_rule -->
      <rect x="332" y="52" width="112" height="48" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="388" y="80" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">mapping_rule</text>

      <!-- wallet_mutations (focal) -->
      <rect x="464" y="52" width="120" height="48" rx="6" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="524" y="80" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">wallet_mutations</text>

      <!-- wallet_mutation_item -->
      <rect x="332" y="132" width="112" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="388" y="156" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">mutation_item</text>

      <!-- wallet_record_links -->
      <rect x="464" y="132" width="120" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="524" y="156" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">record_links</text>

      <!-- activity_events -->
      <rect x="604" y="52" width="96" height="48" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="652" y="80" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">activity_events</text>

      <!-- account_cache -->
      <rect x="712" y="52" width="100" height="48" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="762" y="80" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">account_cache</text>

      <!-- category_cache -->
      <rect x="824" y="52" width="108" height="48" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="878" y="80" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">category_cache</text>

      <!-- label_cache -->
      <rect x="712" y="132" width="100" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="762" y="156" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">label_cache</text>

      <!-- conn_status -->
      <rect x="824" y="132" width="108" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="878" y="156" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">conn_status</text>

      <!-- app_settings -->
      <rect x="32" y="260" width="120" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="92" y="284" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">app_settings</text>

      <!-- capability_ledger -->
      <rect x="172" y="260" width="120" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="232" y="284" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">capability_ledger</text>

      <!-- decision_traces -->
      <rect x="320" y="260" width="112" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="376" y="284" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">decision_traces</text>

      <!-- parser_rules -->
      <rect x="452" y="260" width="100" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="502" y="284" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">parser_rules</text>

      <!-- app_lock_state -->
      <rect x="572" y="260" width="96" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="620" y="284" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">app_lock</text>

      <!-- deletion_audit -->
      <rect x="688" y="260" width="100" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="738" y="284" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">deletion_audit</text>

      <!-- schema_metadata -->
      <rect x="808" y="260" width="100" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="858" y="284" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">schema_meta</text>

      <!-- ===== RELATIONSHIPS ===== -->
      <!-- sms_events 1:1 candidates -->
      <line x1="152" y1="76" x2="172" y2="76" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="153" y="66" width="18" height="10" rx="2" fill="var(--paper)"/>
      <text x="162" y="74" fill="var(--ink)" font-size="7" font-family="var(--mono)" text-anchor="middle">1:1</text>

      <!-- candidates → wallet_mutations -->
      <path d="M 292 76 H 452 Q 460 76 460 84 V 76 H 464" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="360" y="66" width="64" height="10" rx="2" fill="var(--paper)"/>
      <text x="392" y="74" fill="var(--accent)" font-size="7" font-family="var(--mono)" text-anchor="middle">1:N partial</text>

      <!-- candidates 1:N decision_traces -->
      <path d="M 232 100 V 260" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="216" y="176" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="232" y="184" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">1:N</text>

      <!-- wallet_mutations 1:N mutation_item -->
      <path d="M 480 100 V 132" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="464" y="112" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="480" y="120" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">1:N</text>

      <!-- wallet_mutations 1:N activity_events -->
      <path d="M 584 76 H 604" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="586" y="66" width="18" height="10" rx="2" fill="var(--paper)"/>
      <text x="595" y="74" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">1:N</text>

      <!-- record_links ↔ wallet_mutations -->
      <line x1="524" y1="132" x2="524" y2="100" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3"/>
      <rect x="508" y="112" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="524" y="120" fill="var(--muted)" font-size="6" font-family="var(--mono)" text-anchor="middle">N:M</text>

      <!-- account_cache ↔ conn_status -->
      <line x1="812" y1="100" x2="812" y2="132" stroke="var(--muted)" stroke-width="1"/>
      <rect x="800" y="108" width="24" height="10" rx="2" fill="var(--paper)"/>
      <text x="812" y="116" fill="var(--muted)" font-size="6" font-family="var(--mono)" text-anchor="middle">N:1</text>

      <!-- category_cache ↔ conn_status -->
      <line x1="920" y1="100" x2="920" y2="132" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3"/>

      <!-- label_cache → record_links -->
      <path d="M 712 152 H 680 Q 668 152 668 164 V 152 H 584" fill="none" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="636" y="148" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="652" y="156" fill="var(--muted)" font-size="6" font-family="var(--mono)" text-anchor="middle">N:M</text>

      <!-- app_settings → sms_events (privacy_epoch) -->
      <path d="M 92 260 V 240 Q 92 232 100 232 H 92" fill="none" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3"/>
      <rect x="76" y="236" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="92" y="244" fill="var(--muted)" font-size="6" font-family="var(--mono)" text-anchor="middle">epoch</text>

      <!-- parser_rules → candidates -->
      <path d="M 502 260 V 240 Q 502 232 494 232 H 340 Q 332 232 332 224 V 200" fill="none" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- tracked_senders → sms_events -->
      <line x1="86" y1="132" x2="86" y2="100" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3"/>
      <rect x="74" y="112" width="24" height="10" rx="2" fill="var(--paper)"/>
      <text x="86" y="120" fill="var(--muted)" font-size="6" font-family="var(--mono)" text-anchor="middle">join</text>

      <!-- ===== LEGEND ===== -->
      <line x1="30" y1="330" x2="970" y2="330" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="30" y="350" fill="var(--muted)" font-size="8" font-family="var(--mono)" letter-spacing=".14em">LEGEND</text>
      <line x1="100" y1="346" x2="120" y2="346" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="126" y="350" fill="var(--muted)" font-size="8" font-family="var(--mono)">1:1 Unique FK</text>
      <line x1="240" y1="346" x2="260" y2="346" stroke="var(--muted)" stroke-width="1"/>
      <text x="266" y="350" fill="var(--muted)" font-size="8" font-family="var(--mono)">1:N Foreign key</text>
      <line x1="380" y1="346" x2="400" y2="346" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3"/>
      <text x="406" y="350" fill="var(--muted)" font-size="8" font-family="var(--mono)">N:M Joinable (no FK)</text>
      <line x1="540" y1="346" x2="560" y2="346" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="566" y="350" fill="var(--muted)" font-size="8" font-family="var(--mono)">Partial unique index</text>
      <rect x="700" y="340" width="60" height="10" rx="2" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="730" y="348" fill="var(--ink)" font-size="7" font-weight="600" font-family="var(--sans)" text-anchor="middle">SINGLETON</text>
      <text x="768" y="350" fill="var(--muted)" font-size="8" font-family="var(--mono)">id = 1 seeded row</text>
    </svg>
  </div>
</body>
</html>
