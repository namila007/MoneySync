<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync — Review → Create Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--link:#2e5aa8;
      --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}
    .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
    svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · User Flow</p>
    <h1>Review → Create Gate Chain</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">Review to Create Gate Chain</title>
      <desc id="flow-desc">Flowchart showing the 8-step pre-send eligibility gate chain from inbox review to atomic outbox write.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- START -->
      <ellipse cx="120" cy="40" rx="56" ry="16" fill="var(--ink)"/>
      <text x="120" y="44" fill="#fff" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">Inbox Detail</text>

      <line x1="120" y1="56" x2="120" y2="84" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Review Panel -->
      <rect x="64" y="88" width="112" height="36" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="120" y="110" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">Edit Panel</text>

      <line x1="120" y1="124" x2="120" y2="152" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Create button -->
      <rect x="64" y="156" width="112" height="36" rx="6" fill="var(--accent)" stroke="var(--accent)" stroke-width="1"/>
      <text x="120" y="178" fill="#fff" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">Create</text>

      <line x1="120" y1="192" x2="120" y2="220" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- GATE CHAIN (vertical) -->
      <rect x="280" y="24" width="180" height="340" rx="8" fill="rgba(235,108,54,.03)" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="370" y="42" fill="var(--accent)" font-size="7" font-family="var(--mono)" text-anchor="middle" letter-spacing=".14em">PRE-SEND GATES (8)</text>

      <!-- Gate 1 -->
      <rect x="300" y="56" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="76" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">1. Privacy Epoch</text>

      <line x1="370" y1="88" x2="370" y2="100" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 2 -->
      <rect x="300" y="104" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="124" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">2. Consent</text>

      <line x1="370" y1="136" x2="370" y2="148" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 3 -->
      <rect x="300" y="152" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="172" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">3. Wallet Connection</text>

      <line x1="370" y1="184" x2="370" y2="196" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 4 -->
      <rect x="300" y="200" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="220" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">4. Account Eligible</text>

      <line x1="370" y1="232" x2="370" y2="244" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 5 -->
      <rect x="300" y="248" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="268" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">5. Mapping Resolution</text>

      <line x1="370" y1="280" x2="370" y2="292" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 6 -->
      <rect x="300" y="296" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="316" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">6. Candidate Validation</text>

      <line x1="370" y1="328" x2="370" y2="340" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 7 -->
      <rect x="300" y="344" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="364" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">7. Duplicate Tombstone</text>

      <line x1="370" y1="376" x2="370" y2="388" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gate 8 -->
      <rect x="300" y="392" width="140" height="32" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="370" y="412" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">8. Capability</text>

      <!-- Arrow from Create to gate chain -->
      <path d="M 176 174 H 280 Q 288 174 288 182 V 56 H 300" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- BLOCKED path (right side) -->
      <path d="M 440 268 H 560 Q 568 268 568 276 V 268 H 568" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="480" y="256" width="56" height="12" rx="2" fill="var(--paper)"/>
      <text x="508" y="265" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">BLOCKED</text>

      <rect x="572" y="248" width="120" height="32" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="632" y="268" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">Blocked Reason</text>

      <!-- PASS path -->
      <line x1="370" y1="424" x2="370" y2="452" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="354" y="432" width="32" height="12" rx="2" fill="var(--paper)"/>
      <text x="370" y="441" fill="var(--accent)" font-size="7" font-family="var(--mono)" text-anchor="middle">PASS</text>

      <!-- Atomic Write -->
      <rect x="296" y="456" width="148" height="36" rx="6" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="370" y="478" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Atomic Write</text>

      <!-- Result boxes -->
      <line x1="370" y1="492" x2="370" y2="510" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Duplicate check -->
      <rect x="240" y="514" width="100" height="28" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="290" y="532" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">2067 → Dup</text>

      <line x1="340" y1="528" x2="370" y2="528" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="376" y="514" width="96" height="28" rx="6" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1"/>
      <text x="424" y="532" fill="var(--accent)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">succeeded</text>

      <!-- ===== LEGEND ===== -->
      <line x1="680" y1="40" x2="680" y2="500" stroke="rgba(45,49,66,.06)" stroke-width=".8"/>
      <text x="700" y="60" fill="var(--muted)" font-size="8" font-family="var(--mono)" letter-spacing=".14em">LEGEND</text>
      <rect x="700" y="76" width="60" height="20" rx="6" fill="var(--ink)"/>
      <text x="730" y="90" fill="#fff" font-size="8" font-weight="600" font-family="var(--sans)" text-anchor="middle">Start</text>
      <rect x="700" y="108" width="60" height="20" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="730" y="122" fill="var(--ink)" font-size="8" font-weight="600" font-family="var(--sans)" text-anchor="middle">Step</text>
      <rect x="700" y="140" width="60" height="20" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="730" y="154" fill="var(--ink)" font-size="8" font-weight="600" font-family="var(--sans)" text-anchor="middle">Decision</text>
      <rect x="700" y="172" width="60" height="20" rx="6" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="730" y="186" fill="var(--accent)" font-size="8" font-weight="600" font-family="var(--sans)" text-anchor="middle">Focal</text>
      <line x1="700" y1="208" x2="760" y2="208" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="770" y="212" fill="var(--muted)" font-size="8" font-family="var(--mono)">Flow</text>
      <line x1="700" y1="228" x2="760" y2="228" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="770" y="232" fill="var(--muted)" font-size="8" font-family="var(--mono)">Blocked</text>
    </svg>
  </div>
</body>
</html>
