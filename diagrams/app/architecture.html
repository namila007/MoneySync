<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync — Clean Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--link:#2e5aa8;
      --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}
    .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
    svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Clean Architecture</p>
    <h1>MoneySync Layered Architecture</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">MoneySync Clean Architecture</title>
      <desc id="arch-desc">Four-layer Clean Architecture: Presentation, Application, Domain, and Data with dependency rule flowing inward.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Dependency rule indicator -->
      <text x="20" y="220" fill="var(--accent)" font-size="8" font-family="var(--mono)" text-anchor="middle" transform="rotate(-90 20 220)" letter-spacing=".12em">DEPENDENCY RULE →</text>

      <!-- PRESENTATION -->
      <rect x="48" y="24" width="920" height="80" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="64" y="40" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" letter-spacing=".14em">PRESENTATION</text>
      <rect x="64" y="52" width="120" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="124" y="76" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">GoRouter 17</text>
      <rect x="200" y="52" width="160" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="280" y="76" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">18 Material 3 Screens</text>
      <rect x="376" y="52" width="140" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="446" y="76" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Riverpod 3.x</text>
      <rect x="532" y="52" width="140" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="602" y="76" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Immutable State</text>
      <rect x="688" y="52" width="120" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="748" y="76" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Material 3 Theme</text>
      <rect x="824" y="52" width="132" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="890" y="76" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">4-Tab Shell</text>

      <!-- APPLICATION -->
      <rect x="48" y="120" width="920" height="80" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="64" y="136" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" letter-spacing=".14em">APPLICATION</text>
      <rect x="64" y="148" width="160" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="144" y="172" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Use Cases</text>
      <rect x="240" y="148" width="160" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="320" y="172" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">App Services</text>
      <rect x="416" y="148" width="140" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="486" y="172" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Atomic Writers</text>
      <rect x="572" y="148" width="140" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="642" y="172" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">DI Wiring</text>
      <rect x="728" y="148" width="228" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="842" y="172" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Flavor Entrypoints</text>

      <!-- DOMAIN (focal) -->
      <rect x="48" y="216" width="920" height="80" rx="8" fill="rgba(235,108,54,.03)" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="64" y="232" fill="var(--accent)" font-size="7" font-family="var(--mono)" letter-spacing=".14em">DOMAIN · PURE DART</text>
      <rect x="64" y="244" width="140" height="40" rx="6" fill="#fff" stroke="var(--accent)" stroke-width="1"/>
      <text x="134" y="268" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Core Domain</text>
      <rect x="220" y="244" width="140" height="40" rx="6" fill="#fff" stroke="var(--accent)" stroke-width="1"/>
      <text x="290" y="268" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Rule Engine</text>
      <rect x="376" y="244" width="120" height="40" rx="6" fill="#fff" stroke="var(--accent)" stroke-width="1"/>
      <text x="436" y="268" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Mapping Resolver</text>
      <rect x="512" y="244" width="140" height="40" rx="6" fill="#fff" stroke="var(--accent)" stroke-width="1"/>
      <text x="582" y="268" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">PreSend Gates (8)</text>
      <rect x="668" y="244" width="160" height="40" rx="6" fill="#fff" stroke="var(--accent)" stroke-width="1"/>
      <text x="748" y="268" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Outbox State Machine</text>
      <rect x="844" y="244" width="112" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="900" y="268" fill="var(--ink)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">No Framework Imports</text>

      <!-- DATA -->
      <rect x="48" y="312" width="920" height="80" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="64" y="328" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" letter-spacing=".14em">DATA</text>
      <rect x="64" y="340" width="140" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="134" y="364" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Drift / SQLCipher</text>
      <rect x="220" y="340" width="120" height="40" rx="6" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="280" y="364" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Dio 5</text>
      <rect x="356" y="340" width="120" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="416" y="364" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">HMAC Signing</text>
      <rect x="492" y="340" width="120" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="552" y="364" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Keystore</text>
      <rect x="628" y="340" width="160" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="708" y="364" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">Pigeon 27 (4 APIs)</text>
      <rect x="804" y="340" width="152" height="40" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="880" y="364" fill="var(--muted)" font-size="10" font-weight="600" font-family="var(--sans)" text-anchor="middle">Fake + HTTP Sources</text>

      <!-- NATIVE -->
      <rect x="48" y="404" width="920" height="28" rx="8" fill="rgba(45,49,66,.04)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="64" y="422" fill="rgba(45,49,66,.35)" font-size="7" font-family="var(--mono)" letter-spacing=".14em">NATIVE (Kotlin)</text>
      <text x="180" y="422" fill="var(--muted)" font-size="9" font-family="var(--mono)">MainActivity · SMS delegates · ShareIntent · SecurityChannel · NativeLogTree · UNCHANGED IN M5</text>

      <!-- Legend -->
      <line x1="30" y1="460" x2="970" y2="460" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="30" y="478" fill="var(--muted)" font-size="8" font-family="var(--mono)" letter-spacing=".14em">LEGEND</text>
      <rect x="100" y="470" width="80" height="10" rx="2" fill="rgba(235,108,54,.03)" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="188" y="478" fill="var(--muted)" font-size="8" font-family="var(--mono)">Domain (pure Dart)</text>
      <rect x="320" y="470" width="80" height="10" rx="2" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="408" y="478" fill="var(--muted)" font-size="8" font-family="var(--mono)">Layer boundary</text>
      <rect x="520" y="470" width="80" height="10" rx="2" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="608" y="478" fill="var(--muted)" font-size="8" font-family="var(--mono)">Core component</text>
      <rect x="720" y="470" width="80" height="10" rx="2" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="808" y="478" fill="var(--muted)" font-size="8" font-family="var(--mono)">Secondary</text>
    </svg>
  </div>
</body>
</html>
