<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync — Outbox State Machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--link:#2e5aa8;
      --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}
    .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
    svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · Outbox Lifecycle</p>
    <h1>Wallet Mutation State Machine</h1>

    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc">
      <title id="state-title">Wallet Mutation State Machine</title>
      <desc id="state-desc">State machine showing the outbox lifecycle from queued through syncing to succeeded or permanent failure, with retry and recovery paths.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- START dot -->
      <circle cx="48" cy="140" r="6" fill="var(--ink)"/>

      <!-- queued -->
      <rect x="80" y="120" width="100" height="40" rx="8" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="130" y="144" fill="var(--ink)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">queued</text>

      <line x1="54" y1="140" x2="80" y2="140" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- syncing (focal) -->
      <rect x="232" y="120" width="100" height="40" rx="8" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="282" y="144" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">syncing</text>

      <line x1="180" y1="140" x2="232" y2="140" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="186" y="128" width="40" height="10" rx="2" fill="var(--paper)"/>
      <text x="206" y="136" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">lease</text>

      <!-- succeeded (focal) -->
      <rect x="400" y="120" width="100" height="40" rx="8" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="450" y="144" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">succeeded</text>

      <line x1="332" y1="140" x2="400" y2="140" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- END dot (succeeded) -->
      <circle cx="516" cy="140" r="8" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="516" cy="140" r="5" fill="var(--ink)"/>
      <line x1="500" y1="140" x2="508" y2="140" stroke="var(--ink)" stroke-width="1.2"/>

      <!-- retryScheduled -->
      <rect x="232" y="232" width="120" height="40" rx="8" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="292" y="256" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">retryScheduled</text>

      <!-- syncing → retryScheduled -->
      <line x1="282" y1="160" x2="282" y2="232" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="264" y="190" width="36" height="10" rx="2" fill="var(--paper)"/>
      <text x="282" y="198" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">fail</text>

      <!-- retryScheduled → syncing -->
      <path d="M 292 232 V 220 Q 292 212 284 212 H 220 Q 212 212 212 204 V 160" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="216" y="216" width="56" height="10" rx="2" fill="var(--paper)"/>
      <text x="244" y="224" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">next due</text>

      <!-- reconciling -->
      <rect x="400" y="232" width="100" height="40" rx="8" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="450" y="256" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">reconciling</text>

      <!-- syncing → reconciling -->
      <line x1="332" y1="156" x2="400" y2="232" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="356" y="186" width="48" height="10" rx="2" fill="var(--paper)"/>
      <text x="380" y="194" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">timeout</text>

      <!-- reconciling → succeeded -->
      <path d="M 450 232 V 160" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="454" y="190" width="56" height="10" rx="2" fill="var(--paper)"/>
      <text x="482" y="198" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">confirmed</text>

      <!-- reconciling → retryScheduled -->
      <line x1="400" y1="252" x2="352" y2="252" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="360" y="240" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="376" y="248" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">retry</text>

      <!-- permanentFailure -->
      <rect x="560" y="232" width="120" height="40" rx="8" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="620" y="256" fill="var(--muted)" font-size="11" font-weight="600" font-family="var(--sans)" text-anchor="middle">permanentFailure</text>

      <!-- reconciling → permanentFailure -->
      <line x1="500" y1="252" x2="560" y2="252" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="512" y="240" width="40" height="10" rx="2" fill="var(--paper)"/>
      <text x="532" y="248" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">perm</text>

      <!-- END dot (permanentFailure) -->
      <circle cx="696" cy="252" r="8" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="696" cy="252" r="5" fill="var(--ink)"/>
      <line x1="680" y1="252" x2="688" y2="252" stroke="var(--ink)" stroke-width="1.2"/>

      <!-- supersededBeforeSend -->
      <rect x="80" y="232" width="120" height="40" rx="8" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="140" y="250" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">superseded</text>
      <text x="140" y="262" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">BeforeSend</text>

      <!-- queued → superseded -->
      <line x1="130" y1="160" x2="130" y2="232" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="114" y="192" width="32" height="10" rx="2" fill="var(--paper)"/>
      <text x="130" y="200" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">dup</text>

      <!-- syncing states -->
      <rect x="720" y="100" width="80" height="28" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="760" y="118" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">unknown*</text>

      <rect x="720" y="140" width="80" height="28" rx="6" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="760" y="158" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">unknownDel</text>

      <path d="M 332 140 H 712 Q 720 140 720 148 V 154" fill="none" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="4,3"/>
      <rect x="520" y="128" width="56" height="10" rx="2" fill="var(--paper)"/>
      <text x="548" y="136" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">no resp</text>

      <!-- Recovery note -->
      <text x="600" y="320" fill="var(--muted)" font-size="9" font-family="var(--mono)" font-style="italic">Recovery: startup scan moves expired lease → reconciling</text>
      <text x="600" y="336" fill="var(--muted)" font-size="9" font-family="var(--mono)" font-style="italic">Backoff: 30s base × 2^n, cap 4h, ±20% jitter</text>

      <!-- Legend -->
      <line x1="30" y1="360" x2="970" y2="360" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="30" y="378" fill="var(--muted)" font-size="8" font-family="var(--mono)" letter-spacing=".14em">LEGEND</text>
      <circle cx="100" cy="376" r="5" fill="var(--ink)"/>
      <text x="112" y="378" fill="var(--muted)" font-size="8" font-family="var(--mono)">Start</text>
      <circle cx="176" cy="376" r="6" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="176" cy="376" r="3.5" fill="var(--ink)"/>
      <text x="188" y="378" fill="var(--muted)" font-size="8" font-family="var(--mono)">End</text>
      <rect x="236" y="370" width="60" height="10" rx="6" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="304" y="378" fill="var(--muted)" font-size="8" font-family="var(--mono)">Focal state</text>
      <line x1="380" y1="376" x2="410" y2="376" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="418" y="378" fill="var(--muted)" font-size="8" font-family="var(--mono)">Transition</text>
      <line x1="490" y1="376" x2="520" y2="376" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="528" y="378" fill="var(--muted)" font-size="8" font-family="var(--mono)">Alternate / recovery</text>
    </svg>
  </div>
</body>
</html>
