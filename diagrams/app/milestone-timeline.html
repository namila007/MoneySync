<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneySync — Milestone Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--link:#2e5aa8;
      --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}
    .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
    svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Milestones</p>
    <h1>M5 Milestone Progression</h1>

    <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeline-title timeline-desc">
      <title id="timeline-title">M5 Milestone Timeline</title>
      <desc id="timeline-desc">Timeline showing the M5 milestone slices from M5.1 through M5.23 with completion dates and key deliverables.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Baseline -->
      <line x1="40" y1="160" x2="960" y2="160" stroke="var(--ink)" stroke-width="1"/>

      <!-- Date ticks -->
      <text x="100" y="180" fill="var(--muted)" font-size="8" font-family="var(--mono)" text-anchor="middle">Aug 14</text>
      <line x1="100" y1="156" x2="100" y2="164" stroke="var(--ink)" stroke-width="1"/>

      <text x="250" y="180" fill="var(--muted)" font-size="8" font-family="var(--mono)" text-anchor="middle">Aug 15</text>
      <line x1="250" y1="156" x2="250" y2="164" stroke="var(--ink)" stroke-width="1"/>

      <text x="450" y="180" fill="var(--muted)" font-size="8" font-family="var(--mono)" text-anchor="middle">Aug 22</text>
      <line x1="450" y1="156" x2="450" y2="164" stroke="var(--ink)" stroke-width="1"/>

      <text x="600" y="180" fill="var(--muted)" font-size="8" font-family="var(--mono)" text-anchor="middle">Aug 23</text>
      <line x1="600" y1="156" x2="600" y2="164" stroke="var(--ink)" stroke-width="1"/>

      <text x="800" y="180" fill="var(--muted)" font-size="8" font-family="var(--mono)" text-anchor="middle">Aug 27</text>
      <line x1="800" y1="156" x2="800" y2="164" stroke="var(--ink)" stroke-width="1"/>

      <!-- M5.1-M5.5: Foundation (above line) -->
      <circle cx="100" cy="160" r="6" fill="var(--ink)"/>
      <line x1="100" y1="160" x2="100" y2="110" stroke="var(--ink)" stroke-width="1"/>
      <rect x="56" y="86" width="88" height="20" rx="4" fill="#fff" stroke="var(--ink)" stroke-width="1"/>
      <text x="100" y="100" fill="var(--ink)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.1–M5.5</text>
      <text x="100" y="76" fill="var(--muted)" font-size="8" font-family="var(--mono)" text-anchor="middle">Foundation</text>
      <text x="100" y="66" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">schema v9, mapping, outbox</text>

      <!-- M5.6-M5.7: Client -->
      <circle cx="180" cy="160" r="5" fill="var(--ink)"/>
      <line x1="180" y1="160" x2="180" y2="120" stroke="var(--ink)" stroke-width="1"/>
      <rect x="140" y="100" width="80" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="180" y="112" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.6–M5.7</text>
      <text x="180" y="92" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Client + live spike</text>

      <!-- M5.8-M5.10: Gate & Write -->
      <circle cx="250" cy="160" r="5" fill="var(--ink)"/>
      <line x1="250" y1="160" x2="250" y2="120" stroke="var(--ink)" stroke-width="1"/>
      <rect x="210" y="100" width="80" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="250" y="112" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.8–M5.10</text>
      <text x="250" y="92" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Gates + atomic write</text>

      <!-- M5.11-M5.12: Surfaces -->
      <circle cx="320" cy="160" r="5" fill="var(--ink)"/>
      <line x1="320" y1="160" x2="320" y2="120" stroke="var(--ink)" stroke-width="1"/>
      <rect x="280" y="100" width="80" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="320" y="112" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.11–M5.12</text>
      <text x="320" y="92" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Dashboard + activity</text>

      <!-- M5.13: Acceptance (focal) -->
      <circle cx="400" cy="160" r="7" fill="var(--accent)"/>
      <line x1="400" y1="160" x2="400" y2="100" stroke="var(--accent)" stroke-width="1.2"/>
      <rect x="360" y="76" width="80" height="20" rx="4" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="400" y="90" fill="var(--accent)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.13</text>
      <text x="400" y="66" fill="var(--accent)" font-size="8" font-family="var(--mono)" text-anchor="middle" font-weight="600">E2E PASS</text>
      <text x="400" y="56" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">adversarial gates</text>

      <!-- M5.14-M5.16: Hardening (below line) -->
      <circle cx="500" cy="160" r="5" fill="var(--ink)"/>
      <line x1="500" y1="160" x2="500" y2="200" stroke="var(--ink)" stroke-width="1"/>
      <rect x="456" y="204" width="88" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="500" y="216" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.14–M5.16</text>
      <text x="500" y="232" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Gap fixes + dashboard flow</text>

      <!-- M5.17: Categories -->
      <circle cx="580" cy="160" r="5" fill="var(--ink)"/>
      <line x1="580" y1="160" x2="580" y2="200" stroke="var(--ink)" stroke-width="1"/>
      <rect x="540" y="204" width="80" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="580" y="216" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.17</text>
      <text x="580" y="232" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Categories + waiting</text>

      <!-- M5.18-M5.20: Accumulated -->
      <circle cx="660" cy="160" r="5" fill="var(--ink)"/>
      <line x1="660" y1="160" x2="660" y2="200" stroke="var(--ink)" stroke-width="1"/>
      <rect x="620" y="204" width="80" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="660" y="216" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.18–M5.20</text>
      <text x="660" y="232" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Routing, catalog, outbox</text>

      <!-- M5.21: Labels -->
      <circle cx="740" cy="160" r="5" fill="var(--ink)"/>
      <line x1="740" y1="160" x2="740" y2="200" stroke="var(--ink)" stroke-width="1"/>
      <rect x="708" y="204" width="64" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="740" y="216" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.21</text>
      <text x="740" y="232" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Labels + counterparty</text>

      <!-- M5.22: Gap closure -->
      <circle cx="800" cy="160" r="5" fill="var(--ink)"/>
      <line x1="800" y1="160" x2="800" y2="200" stroke="var(--ink)" stroke-width="1"/>
      <rect x="772" y="204" width="56" height="16" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="800" y="216" fill="var(--muted)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.22</text>
      <text x="800" y="232" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">Gap closure</text>

      <!-- M5.23: Exit gate (focal) -->
      <circle cx="860" cy="160" r="7" fill="var(--accent)"/>
      <line x1="860" y1="160" x2="860" y2="200" stroke="var(--accent)" stroke-width="1.2"/>
      <rect x="824" y="204" width="72" height="20" rx="4" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="860" y="218" fill="var(--accent)" font-size="9" font-weight="600" font-family="var(--sans)" text-anchor="middle">M5.23</text>
      <text x="860" y="240" fill="var(--accent)" font-size="8" font-family="var(--mono)" text-anchor="middle" font-weight="600">EXIT GATE</text>
      <text x="860" y="252" fill="var(--muted)" font-size="7" font-family="var(--mono)" text-anchor="middle">coverage + adversarial</text>

      <!-- Schema version milestones -->
      <rect x="40" y="280" width="920" height="40" rx="6" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.06)" stroke-width=".8"/>
      <text x="60" y="296" fill="rgba(45,49,66,.40)" font-size="7" font-family="var(--mono)" letter-spacing=".14em">SCHEMA</text>
      <text x="120" y="296" fill="var(--muted)" font-size="8" font-family="var(--mono)">v9</text>
      <text x="170" y="296" fill="var(--muted)" font-size="8" font-family="var(--mono)">v10</text>
      <text x="220" y="296" fill="var(--muted)" font-size="8" font-family="var(--mono)">v11</text>
      <text x="320" y="296" fill="var(--muted)" font-size="8" font-family="var(--mono)">v12</text>
      <text x="520" y="296" fill="var(--muted)" font-size="8" font-family="var(--mono)">v14</text>
      <text x="620" y="296" fill="var(--muted)" font-size="8" font-family="var(--mono)">v15</text>

      <text x="120" y="310" fill="var(--muted)" font-size="7" font-family="var(--mono)">M5.1</text>
      <text x="170" y="310" fill="var(--muted)" font-size="7" font-family="var(--mono)">M5.14</text>
      <text x="220" y="310" fill="var(--muted)" font-size="7" font-family="var(--mono)">M5.15</text>
      <text x="320" y="310" fill="var(--muted)" font-size="7" font-family="var(--mono)">M5.17</text>
      <text x="520" y="310" fill="var(--muted)" font-size="7" font-family="var(--mono)">M5.21</text>
      <text x="620" y="310" fill="var(--muted)" font-size="7" font-family="var(--mono)">M5.22</text>

      <!-- Legend -->
      <line x1="30" y1="340" x2="970" y2="340" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <text x="30" y="358" fill="var(--muted)" font-size="8" font-family="var(--mono)" letter-spacing=".14em">LEGEND</text>
      <circle cx="100" cy="356" r="5" fill="var(--ink)"/>
      <text x="112" y="358" fill="var(--muted)" font-size="8" font-family="var(--mono)">Slice</text>
      <circle cx="176" cy="356" r="6" fill="var(--accent)"/>
      <text x="188" y="358" fill="var(--muted)" font-size="8" font-family="var(--mono)">Major milestone</text>
      <rect x="296" y="350" width="56" height="10" rx="4" fill="#fff" stroke="var(--muted)" stroke-width="1"/>
      <text x="360" y="358" fill="var(--muted)" font-size="8" font-family="var(--mono)">Slice label</text>
      <rect x="440" y="350" width="56" height="10" rx="4" fill="rgba(235,108,54,.06)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="504" y="358" fill="var(--muted)" font-size="8" font-family="var(--mono)">Focal milestone</text>
    </svg>
  </div>
</body>
</html>
